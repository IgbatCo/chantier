<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1d1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Carnet de Chantier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e2db;--accent:#d9480f;--accent-soft:#fff0e6;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:22px;font-weight:700}h2{font-size:18px;font-weight:700}h3{font-size:15px;font-weight:600}
.top{position:sticky;top:0;z-index:20;background:#1d1d1b;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));min-height:54px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.2px;flex:1;min-width:0}
.logo{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;flex:none}
.top .title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.icobtn{background:transparent;border:0;color:inherit;min-width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;font-size:20px;padding:0 8px}
.icobtn:hover{background:rgba(255,255,255,.1)}
.icobtn.txt{font-size:13px;font-weight:600}
.banner{background:#fff8db;border-bottom:1px solid #f0e3a8;padding:8px 14px;font-size:13px;color:#6b5600}
.banner.info{background:var(--accent-soft);border-color:#ffd8bf;color:#8a2f06;display:flex;align-items:center;gap:10px}
.banner.info b{flex:1}
.wrap{max-width:1100px;margin:0 auto;padding:16px 14px 120px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#cfccc2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dark{background:#1d1d1b;border-color:#1d1d1b;color:#fff}
.btn.green{background:#2f9e44;border-color:#2f9e44;color:#fff}
.btn.danger{color:#c92a2a;border-color:#f3c4c4}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.grid{display:grid;gap:12px}
.g-proj{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.proj{cursor:pointer}.proj:hover{border-color:var(--accent)}
.muted{color:var(--mute)}.small{font-size:13px}
.empty{text-align:center;padding:36px 16px;color:var(--mute)}
.empty .big{font-size:40px;margin-bottom:8px}
.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto;position:sticky;top:calc(54px + env(safe-area-inset-top));z-index:15}
.tab{border:0;background:none;padding:12px;font-weight:600;font-size:14px;color:var(--mute);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-color:var(--accent)}
@media (max-width:700px){
  .tabs{position:fixed;bottom:0;top:auto;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;justify-content:space-around;padding:0 0 env(safe-area-inset-bottom)}
  .tab{display:flex;flex-direction:column;align-items:center;font-size:10.5px;padding:8px 4px 9px;border-bottom:0;border-top:2px solid transparent;gap:2px}
  .tab.on{border-color:var(--accent)}.tab i{font-style:normal;font-size:18px}
}
@media (min-width:701px){.tab i{display:none}}
.fab{position:fixed;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:25;background:var(--accent);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 6px 18px rgba(217,72,15,.35);cursor:pointer}
@media (max-width:700px){.fab{bottom:calc(82px + env(safe-area-inset-bottom))}}
.stats{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.stat{padding:12px 14px}.stat .n{font-size:26px;font-weight:700}.stat .l{font-size:13px;color:var(--mute)}
.bar{height:10px;background:#eceae3;border-radius:6px;overflow:hidden;display:flex}.bar span{display:block;height:100%}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
.t td{padding:9px 6px;border-bottom:1px solid #f0eee8;vertical-align:top}
.t td.n,.t th.n{text-align:center;width:56px}
.tscroll{overflow-x:auto}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.filters{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
@media (min-width:700px){.filters{grid-template-columns:2fr 1fr 1fr 1fr}}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;outline:none}
.inp:focus{border-color:var(--accent)}
.issue{display:flex;gap:12px;align-items:center;padding:10px;cursor:pointer}
.issue:hover{border-color:#cfccc2}
.thumb{width:58px;height:58px;border-radius:9px;background:#eceae3 center/cover no-repeat;flex:none;display:grid;place-items:center;font-size:22px;color:#aaa}
.issue .body{flex:1;min-width:0}
.issue .ttl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;color:#fff;font-size:12px;font-weight:700;padding:0 6px;margin-right:6px}
.late{color:#c92a2a;font-weight:600}
.g-plans{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.plancard{padding:0;overflow:hidden;cursor:pointer}
.plancard .im{aspect-ratio:4/3;background:#eceae3 center/contain no-repeat}
.plancard .cap{padding:10px 12px}
.pv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.plan-scroll{overflow:auto;background:#e9e7e0;border:1px solid var(--line);border-radius:var(--r);height:calc(100vh - 240px);min-height:320px}
.plan-inner{position:relative;margin:0 auto}
.plan-inner img{display:block;width:100%;user-select:none;-webkit-user-drag:none}
.plan-inner.adding{cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-50%);min-width:26px;height:26px;border-radius:13px;border:2px solid #fff;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.toggle.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(20,20,18,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:701px){.ov{align-items:center;padding:20px}}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
@media (min-width:701px){.sheet{border-radius:16px}}
.sheet.wide{max-width:900px}
.mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mh h2{flex:1}
.x{border:0;background:#f1efe9;width:34px;height:34px;border-radius:17px;font-size:20px;cursor:pointer;flex:none}
.mb{padding:14px 16px;overflow:auto;flex:1}
.mf{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
label.f,.fld{display:block;margin-bottom:12px;font-size:13px;font-weight:600;color:#45443f}
label.f .inp{margin-top:5px;font-weight:400}
.fld>span{display:block;margin-bottom:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:500px){.g2{grid-template-columns:1fr}}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font-size:13px;font-weight:600;cursor:pointer}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:86px;height:86px;border-radius:10px;background:#eee center/cover no-repeat;cursor:zoom-in}
.ph button{position:absolute;width:26px;height:26px;border-radius:13px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;cursor:pointer;display:grid;place-items:center}
.ph .rm{top:4px;right:4px}.ph .ed{bottom:4px;right:4px}
.addph{width:86px;height:86px;border:1.5px dashed #cfccc2;border-radius:10px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mute);cursor:pointer;background:#faf9f6}
.addph input{display:none}
.mini{position:relative;width:100%;max-width:300px;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer;margin-top:8px}
.mini img{display:block;width:100%}
.hist{border-left:2px solid var(--line);padding-left:10px;margin:6px 0 8px}
.hist div{font-size:13px;margin-bottom:4px;font-weight:400}
.hist small{color:var(--mute)}
.att{display:grid;grid-template-columns:1fr 110px 70px 70px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #f0eee8;font-weight:400}
@media (max-width:500px){.att{grid-template-columns:1fr 1fr 1fr}.att>span{grid-column:1/-1}}
.chk{display:flex;align-items:center;gap:8px;font-weight:500;margin:6px 0;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,40px);background:#1d1d1b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;z-index:100;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.annot canvas{width:100%;display:block;touch-action:none;border-radius:8px;background:#222}
.colors{display:flex;gap:6px}
.colors button{width:30px;height:30px;border-radius:15px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.colors button.on{box-shadow:0 0 0 2px var(--ink)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--mute)}.kv dd{margin:0}
.section-t{margin:22px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-t h2{flex:1}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.8);z-index:90;display:grid;place-items:center;font-weight:600;text-align:center;padding:20px}
.kp{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;border:1px solid}
.kp .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:6px;color:#fff;flex:none;margin-top:2px}
.kp .tx{flex:1;white-space:pre-wrap}
.kp button{border:0;background:none;cursor:pointer;color:var(--mute);font-size:16px}
.addline{display:grid;grid-template-columns:130px 1fr auto auto;gap:6px;margin-top:6px}
@media (max-width:560px){.addline{grid-template-columns:1fr auto auto}.addline select{grid-column:1/-1}}
.act{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f0eee8}
.act:last-child{border-bottom:0}
.act .cb{width:24px;height:24px;border-radius:7px;border:2px solid #cfccc2;background:#fff;cursor:pointer;flex:none;display:grid;place-items:center;font-weight:700;color:#fff}
.act .cb.on{background:#2f9e44;border-color:#2f9e44}
.act .body{flex:1;min-width:0}
.act.done .tx{text-decoration:line-through;color:var(--mute)}
.actform{display:grid;grid-template-columns:2fr 1fr 130px auto;gap:6px;margin-top:10px}
@media (max-width:640px){.actform{grid-template-columns:1fr 1fr}.actform input:first-child{grid-column:1/-1}}
.mic{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 8px;font-size:13px;cursor:pointer;margin-left:6px;font-weight:600}
.mic.on{background:#c92a2a;color:#fff;border-color:#c92a2a}
.sigpad{width:100%;height:180px;border:1.5px dashed #cfccc2;border-radius:10px;touch-action:none;background:#fff;display:block}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.sig{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;position:relative}
.sig img{width:100%;height:70px;object-fit:contain;display:block}
.sig button{position:absolute;top:4px;right:4px;border:0;background:none;cursor:pointer;color:var(--mute)}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.validate{background:#e7f5ff;border:1px solid #a5d8ff;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.linkbox{background:#f8f7f3;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;word-break:break-all;margin:6px 0}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:grid;place-items:center;cursor:zoom-out}
.lightbox img{max-width:96vw;max-height:92vh}
</style>
</head>
<body>
<div id="app"><div class="empty" style="padding-top:30vh">Chargement…</div></div>
<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="toast"></div>
<script>
"use strict";
/* ====================== Configuration ====================== */
const CFG=window.APP_CONFIG||{};
const APP_NAME=CFG.appName||'Carnet de Chantier';
const HAS_SB=!!(CFG.supabaseUrl&&CFG.supabaseKey);
const SB_LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
const JSPDF='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js';
const PDFJSW='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
document.title=APP_NAME;

/* ====================== Utilitaires ====================== */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const token=()=>{const a=new Uint8Array(18);crypto.getRandomValues(a);return Array.from(a,b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('')};
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function fmtDate(v){if(!v)return'';const d=typeof v==='number'?new Date(v):new Date(v+'T12:00:00');if(isNaN(d))return'';return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})}
function fmtDT(ts){const d=new Date(ts);return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
const STATUS={afaire:{l:'À lever',c:'#d6336c'},encours:{l:'En cours',c:'#e67700'},levee:{l:'Levée',c:'#1c7ed6'},validee:{l:'Validée',c:'#2f9e44'}};
const PRIO={basse:'Basse',normale:'Normale',haute:'Haute',urgente:'Urgente'};
const VISIT_TYPES=['Réunion de chantier','Visite de chantier','OPR','Réception','Levée de réserves'];
const PRESENCE={present:'Présent',absent:'Absent',excuse:'Excusé',convoque:'Convoqué'};
const KP={decision:{l:'Décision',c:'#2f9e44',bg:'#ebfbee'},important:{l:'À retenir',c:'#d9480f',bg:'#fff4e6'},alerte:{l:'Alerte',c:'#c92a2a',bg:'#fff5f5'},cout:{l:'Coût / avenant',c:'#7048e8',bg:'#f3f0ff'},info:{l:'Info',c:'#1c7ed6',bg:'#e7f5ff'}};
const LOTS=['VRD','Terrassement','Gros œuvre','Charpente','Couverture','Étanchéité','Façades','Menuiseries extérieures','Serrurerie','Plâtrerie – Isolation','Menuiseries intérieures','Électricité','Plomberie – Sanitaire','CVC','Carrelage – Faïence','Sols souples','Peinture','Ascenseur','Espaces verts','Nettoyage'];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3400)}
function handleErr(e){console.warn(e);const m=(e&&(e.message||e.error_description))||String(e);
  if(/quota|plein/i.test(m))toast('Stockage plein : supprimez des éléments.');
  else if(/JWT|auth|permission|row-level/i.test(m))toast('Action refusée : reconnectez-vous.');
  else if(/Failed to fetch|NetworkError|network/i.test(m))toast('Pas de connexion internet.');
  else toast('Erreur : '+m)}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]'))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Chargement impossible (connexion ?)'));document.head.appendChild(s)})}
function busy(msg){let b=$('#busy');if(!msg){b&&b.remove();return}if(!b){b=document.createElement('div');b.id='busy';b.className='busy';document.body.appendChild(b)}b.textContent=msg}
function saveFile(name,blob){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copié dans le presse-papiers');return true}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();toast(ok?'Copié':'Copie impossible : sélectionnez le texte');return ok}}

/* ====================== Stockage ====================== */
const KIND={companies:'company',plans:'plan',issues:'issue',visits:'visit',actions:'action'};
/* Mode démonstration : navigateur uniquement */
const Local={data:{},ls:[],
  load(){try{this.data=JSON.parse(localStorage.getItem('cdc_demo')||'{}')}catch(e){this.data={}}},
  save(){try{localStorage.setItem('cdc_demo',JSON.stringify(this.data))}catch(e){throw new Error('stockage plein')}},
  par(p){return p.split('/').slice(0,-1).join('/')},
  list(c){return Object.keys(this.data).filter(k=>this.par(k)===c).map(k=>Object.assign({id:k.split('/').pop()},this.data[k]))},
  emit(c){this.ls.filter(l=>l.c===c).forEach(l=>l.cb(this.list(c)))},
  listen(c,cb){const l={c,cb};this.ls.push(l);setTimeout(()=>cb(this.list(c)));return()=>{this.ls=this.ls.filter(x=>x!==l)}},
  async set(p,d){const prev=this.data[p];this.data[p]=JSON.parse(JSON.stringify(d));try{this.save()}catch(e){if(prev===undefined)delete this.data[p];else this.data[p]=prev;throw e}this.emit(this.par(p))},
  async del(p){delete this.data[p];this.save();this.emit(this.par(p))},
  async delProject(pid){Object.keys(this.data).filter(k=>k.startsWith('projects/'+pid+'/')).forEach(k=>delete this.data[k]);delete this.data['projects/'+pid];this.save();this.emit('projects')},
  async upload(blob){return null},
  async listLinks(){return[]},async saveLink(){throw new Error('Les liens entreprises nécessitent la base de données en ligne.')},async revokeLink(){}
};
/* Mode en ligne : Supabase */
const Supa={sb:null,cache:{},ls:[],loaded:{},chans:{},delChan:null,
  parse(c){const s=c.split('/');return s.length===1?{kind:'project',pid:null}:{kind:KIND[s[2]],pid:s[1]}},
  parseDoc(p){const s=p.split('/');return s.length===2?{kind:'project',pid:null,id:s[1]}:{kind:KIND[s[2]],pid:s[1],id:s[3]}},
  key(k,p){return k+'|'+(p||'')},
  bucket(k,p){const key=this.key(k,p);return this.cache[key]||(this.cache[key]={})},
  emit(k,p){const key=this.key(k,p);const b=this.cache[key]||{};const arr=Object.keys(b).map(id=>Object.assign({id},b[id]));this.ls.filter(l=>l.k===key).forEach(l=>l.cb(arr))},
  async fetch(k,p){let q=this.sb.from('items').select('id,data').eq('kind',k);if(p)q=q.eq('project_id',p);const {data,error}=await q;if(error){handleErr(error);return}const b={};data.forEach(r=>b[r.id]=r.data);this.cache[this.key(k,p)]=b;this.emit(k,p)},
  listen(c,cb){const {kind,pid}=this.parse(c);const key=this.key(kind,pid);const l={k:key,cb};this.ls.push(l);
    if(!this.loaded[key]){this.loaded[key]=true;this.fetch(kind,pid);this.subscribe(pid)}else setTimeout(()=>this.emit(kind,pid));
    return()=>{this.ls=this.ls.filter(x=>x!==l)}},

    if(!this.delChan)this.delChan=this.sb.channel('suppressions').on('postgres_changes',{event:'DELETE',schema:'public',table:'items'},pl=>this.onChange(pl)).subscribe()},
  onChange(pl){if(pl.eventType==='DELETE'){const id=pl.old&&pl.old.id;for(const key in this.cache){if(this.cache[key][id]){delete this.cache[key][id];const [k,p]=key.split('|');this.emit(k,p||null)}}return}

  async set(path,d){const {kind,pid,id}=this.parseDoc(path);const b=this.bucket(kind,pid);const prev=b[id];b[id]=JSON.parse(JSON.stringify(d));this.emit(kind,pid);

  async listLinks(pid){const {data,error}=await this.sb.from('access_links').select('*').eq('project_id',pid).eq('revoked',false);if(error)throw error;return data||[]},

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();if(!/^(data|blob):/.test(src))i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=()=>rej(new Error('image'));i.src=src})}
async function blobToImg(b){const u=URL.createObjectURL(b);try{return await loadImg(u)}finally{setTimeout(()=>URL.revokeObjectURL(u),5000)}}
function drawScaled(img,max){const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height;const r=Math.min(1,max/Math.max(W,H));const c=document.createElement('canvas');c.width=Math.round(W*r);c.height=Math.round(H*r);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c}
const canvasBlob=(c,q)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
async function storeImage(blob,kind){const img=await blobToImg(blob);
  if(API===Supa){const c=drawScaled(img,kind==='plan'?2600:1600);const b=await canvasBlob(c,.82);const u=await Supa.upload(b);return{u,w:c.width,h:c.height}}
  const c=drawScaled(img,kind==='plan'?1500:720);return{d:c.toDataURL('image/jpeg',kind==='plan'?.6:.55),w:c.width,h:c.height}}
async function smallPhoto(blob){const img=await blobToImg(blob);const c=drawScaled(img,900);return{d:c.toDataURL('image/jpeg',.6),w:c.width,h:c.height}}
async function srcToData(src,max){const img=await loadImg(src);const c=drawScaled(img,max);return{d:c.toDataURL('image/jpeg',.8),w:c.width,h:c.height}}
async function pdfToBlobs(file,maxPages){await loadScript(PDFJS);await loadScript(PDFJSW);const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=PDFJSW;
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const out=[];const n=Math.min(pdf.numPages,maxPages);
  for(let i=1;i<=n;i++){busy('Conversion du PDF… page '+i+'/'+n);const pg=await pdf.getPage(i);const v0=pg.getViewport({scale:1});const v=pg.getViewport({scale:Math.min(4,2600/Math.max(v0.width,v0.height))});
    const c=document.createElement('canvas');c.width=v.width;c.height=v.height;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:ctx,viewport:v}).promise;out.push(await canvasBlob(c,.85))}
  return{blobs:out,total:pdf.numPages}}

  <div class="card" style="margin-top:12px"><div class="row between small" style="margin-bottom:8px"><b>Avancement de la levée des réserves</b><span>${pct} %</span></div>

   <div class="row small muted" style="margin-top:8px;gap:14px">${Object.keys(STATUS).map(s=>`<span><span class="dot" style="background:${STATUS[s].c}"></span> ${STATUS[s].l}</span>`).join('')}</div></div>

  ${last&&(last.keypoints||[]).length?`<div class="section-t"><h2>À retenir – dernière réunion</h2><button class="btn sm" data-act="open-visit" data-id="${last.id}">Ouvrir</button></div><div class="card">${kpList(last,false)}</div>`:''}
  <div class="section-t"><h2>Actions à suivre</h2><button class="btn sm" data-act="act-new">+ Action</button></div>

   ${rows.map(r=>`<tr ${r.co.id?`data-act="goto-co" data-id="${r.co.id}" style="cursor:pointer"`:''}><td><b>${esc(r.co.name)}</b><div class="muted small">${esc(r.co.lot||'')}</div></td>${Object.keys(STATUS).map(s=>`<td class="n" style="color:${r.k[s]?STATUS[s].c:'#bbb'};font-weight:600">${r.k[s]}</td>`).join('')}<td class="n ${r.k.late?'late':''}">${r.k.late}</td><td class="n"><b>${r.k.total}</b></td></tr>`).join('')}

/* ----- Plans ----- */
function viewPlans(){if(S.planView){const pl=S.plans.find(p=>p.id===S.planView);if(pl)return viewPlan(pl);S.planView=null}
  return `<div class="row between" style="margin-bottom:14px"><h1>Plans</h1><label class="btn primary">+ Ajouter des plans<input type="file" accept="image/*,application/pdf" multiple data-file="plan" hidden></label></div>
  ${S.plans.length?`<div class="grid g-plans">${[...S.plans].sort((a,b)=>(a.name||'').localeCompare(b.name||'','fr',{numeric:true})).map(p=>{const n=S.issues.filter(i=>i.planId===p.id);const open=n.filter(i=>i.status==='afaire'||i.status==='encours').length;
    return `<div class="card plancard" data-act="open-plan" data-id="${p.id}"><div class="im" style="background-image:url('${esc(imgSrc(p.img))}')"></div><div class="cap"><b>${esc(p.name)}</b><div class="small muted">${n.length} réserve(s) · ${open} ouverte(s)</div></div></div>`}).join('')}</div>`
  :`<div class="card empty"><div class="big">🗺️</div>Importez vos plans (image ou PDF : chaque page devient un plan).<br>Vous pourrez ensuite y placer les réserves.</div>`}`}
function viewPlan(pl){const st=S.f.status;const pins=S.issues.filter(i=>i.planId===pl.id&&i.x!=null&&(!st||i.status===st)).sort((a,b)=>a.num-b.num);
  return `<div class="pv-bar"><button class="btn sm" data-act="close-plan">‹ Plans</button><b style="flex:1;min-width:120px">${esc(pl.name)}</b>
  <select class="inp" style="width:auto;padding:6px 8px" data-filter="status"><option value="">Tous statuts</option>${Object.keys(STATUS).map(s=>`<option value="${s}" ${st===s?'selected':''}>${STATUS[s].l}</option>`).join('')}</select>
  <button class="btn sm" data-act="zoom" data-z="-1">−</button><span class="small">${Math.round(S.zoom*100)}%</span><button class="btn sm" data-act="zoom" data-z="1">+</button>
  ${S.placing?'':`<button class="btn sm toggle ${S.adding?'on':''}" data-act="toggle-add">${S.adding?'✓ Touchez le plan':'📍 Ajouter sur le plan'}</button>`}<button class="btn sm" data-act="edit-plan" data-id="${pl.id}">⋯</button></div>
  <div class="plan-scroll"><div class="plan-inner ${S.adding||S.placing?'adding':''}" style="width:${S.zoom*100}%" data-act="plan-tap" data-id="${pl.id}"><img src="${esc(imgSrc(pl.img))}" alt="${esc(pl.name)}" draggable="false">
  ${pins.map(i=>`<button class="pin" style="left:${i.x*100}%;top:${i.y*100}%;background:${STATUS[i.status].c}" data-act="open-issue" data-id="${i.id}" title="${esc(i.title)}">${i.num}</button>`).join('')}</div></div>
  <div class="small muted" style="margin-top:6px">${pins.length} réserve(s) affichée(s).${S.adding?' Mode ajout actif : chaque appui crée une réserve.':''}</div>`}
/* ----- Réserves ----- */
function filtered(){const f=S.f,q=f.q.trim().toLowerCase();return S.issues.filter(i=>(!f.status||i.status===f.status)&&(!f.company||(f.company==='none'?!comp(i.companyId):i.companyId===f.company))&&(!f.plan||i.planId===f.plan)
  &&(!q||[i.title,i.desc,i.loc,String(i.num),compLabel(i.companyId)].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.num-a.num)}
function issueCard(i){const ph=(i.photos||[])[0];const late=isLate(i);
  return `<div class="card issue" data-act="open-issue" data-id="${i.id}"><div class="thumb" style="${ph?`background-image:url('${esc(imgSrc(ph))}')`:''}">${ph?'':'📍'}</div>
  <div class="body"><div class="ttl"><span class="num" style="background:${STATUS[i.status].c}">${i.num}</span>${esc(i.title)}</div>
  <div class="small muted" style="margin-top:3px">${esc(compLabel(i.companyId))}${i.loc?' · '+esc(i.loc):''}${i.planId?' · '+esc(planName(i.planId)):''}</div>
  <div class="small" style="margin-top:3px"><span class="chip" style="background:${STATUS[i.status].c}">${STATUS[i.status].l}${i.status==='levee'&&i.liftedBy==='entreprise'?' par l\'entreprise':''}</span> ${i.due?`<span class="${late?'late':'muted'}">· Échéance ${fmtDate(i.due)}${late?' (retard)':''}</span>`:''} ${i.prio==='haute'||i.prio==='urgente'?`<span class="late">· ${PRIO[i.prio]}</span>`:''}</div></div></div>`}
function issueList(){const l=filtered();return l.length?`<div class="grid">${l.map(issueCard).join('')}</div>`:`<div class="card empty">${S.issues.length?'Aucune réserve ne correspond aux filtres.':'Aucune réserve. Appuyez sur « + Réserve » pour commencer.'}</div>`}
function viewIssues(){const f=S.f;return `<div class="row between" style="margin-bottom:12px"><h1>Réserves <span class="muted" style="font-weight:500" id="icount">${filtered().length}</span></h1>${(f.q||f.status||f.company||f.plan)?`<button class="btn sm" data-act="clear-f">Effacer les filtres</button>`:''}</div>
  <div class="filters"><input class="inp" id="fq" placeholder="Rechercher (titre, n°, localisation…)" value="${esc(f.q)}" data-filter="q">
  <select class="inp" data-filter="status"><option value="">Tous les statuts</option>${Object.keys(STATUS).map(s=>`<option value="${s}" ${f.status===s?'selected':''}>${STATUS[s].l}</option>`).join('')}</select>
  <select class="inp" data-filter="company"><option value="">Toutes les entreprises</option>${comps().map(c=>`<option value="${c.id}" ${f.company===c.id?'selected':''}>${esc((c.lot?c.lot+' – ':'')+c.name)}</option>`).join('')}<option value="none" ${f.company==='none'?'selected':''}>Non affectées</option></select>
  <select class="inp" data-filter="plan"><option value="">Tous les plans</option>${S.plans.map(p=>`<option value="${p.id}" ${f.plan===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div id="issue-list">${issueList()}</div>`}
/* ----- Réunions ----- */
function visitCard(v){const n=S.issues.filter(i=>i.visitId===v.id).length;const pres=S.companies.filter(c=>attOf(v,c.id).p==='present').length;const kp=(v.keypoints||[]).length;
  return `<div class="card issue" data-act="open-visit" data-id="${v.id}"><div class="thumb" style="font-size:20px;color:var(--ink)">${v.id===S.activeVisit?'🟠':'📋'}</div><div class="body"><div class="ttl">${esc(visitLabel(v))}</div><div class="small muted">${pres} entreprise(s) présente(s) · ${kp} point(s) clé(s) · ${n} réserve(s)${v.signatures&&v.signatures.length?' · signé':''}</div></div></div>`}
function viewVisits(){if(S.visitView){const v=S.visits.find(x=>x.id===S.visitView);if(v)return viewVisit(v);S.visitView=null}
  const l=[...S.visits].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(+b.num||0)-(+a.num||0));
  return `<div class="row between" style="margin-bottom:14px"><h1>Réunions & visites</h1><button class="btn primary" data-act="new-visit">+ Nouvelle</button></div>
  ${l.length?`<div class="grid">${l.map(visitCard).join('')}</div>`:`<div class="card empty"><div class="big">📋</div>Créez une réunion de chantier, une visite, des OPR ou une réception.<br>Notez les points clés, les décisions et les actions, puis éditez le PV.</div>`}`}
function kpList(v,editable){const kps=v.keypoints||[];if(!kps.length)return `<div class="muted small">Aucun point clé pour l'instant.</div>`;
  const order=Object.keys(KP);return [...kps].map((k,idx)=>({k,idx})).sort((a,b)=>order.indexOf(a.k.type)-order.indexOf(b.k.type)).map(({k,idx})=>{const t=KP[k.type]||KP.info;
    return `<div class="kp" style="background:${t.bg};border-color:${t.c}33"><span class="tag" style="background:${t.c}">${t.l}</span><div class="tx">${esc(k.text)}</div>${editable?`<button data-act="kp-del" data-k="${idx}" title="Supprimer">✕</button>`:''}</div>`}).join('')}
function viewVisit(v){const iss=S.issues.filter(i=>i.visitId===v.id).sort((a,b)=>a.num-b.num);const att=comps().filter(c=>attOf(v,c.id).p);
  const acts=S.actions.filter(a=>a.status!=='faite'||a.visitId===v.id).sort((a,b)=>(a.status==='faite')-(b.status==='faite')||(a.due||'9').localeCompare(b.due||'9'));
  return `<div class="row" style="margin-bottom:12px"><button class="btn sm" data-act="close-visit">‹ Réunions</button><span class="sp"></span>
   ${v.id===S.activeVisit?`<button class="btn sm" data-act="stop-visit">Terminer</button>`:`<button class="btn sm dark" data-act="start-visit" data-id="${v.id}">▶ Rendre active</button>`}
   <button class="btn sm" data-act="edit-visit" data-id="${v.id}">Modifier</button><button class="btn sm" data-act="next-visit" data-id="${v.id}">⏭ Préparer la suivante</button><button class="btn sm primary" data-act="pv-visit" data-id="${v.id}">📄 PV PDF</button></div>
  <div class="card"><h2>${esc(visitLabel(v))}</h2><dl class="kv" style="margin-top:12px"><dt>Date</dt><dd>${fmtDate(v.date)}</dd>${v.weather?`<dt>Météo</dt><dd>${esc(v.weather)}</dd>`:''}${v.nextDate?`<dt>Prochaine réunion</dt><dd>${fmtDate(v.nextDate)}</dd>`:''}${v.others?`<dt>Autres présents</dt><dd>${esc(v.others)}</dd>`:''}</dl>
   ${v.notes?`<h3 style="margin-top:14px">Observations générales</h3><p style="white-space:pre-wrap;margin:6px 0 0">${esc(v.notes)}</p>`:''}</div>
  <div class="section-t"><h2>⭐ Points clés à retenir</h2></div>
  <div class="card">${kpList(v,true)}<div class="addline"><select class="inp" id="kp-type">${Object.keys(KP).map(k=>`<option value="${k}">${KP[k].l}</option>`).join('')}</select><input class="inp" id="kp-text" placeholder="Ex. : Validation du choix de carrelage C2"><button class="btn sm primary" data-act="kp-add">Ajouter</button>${SR?`<button class="mic" data-act="mic" data-target="kp-text">🎙</button>`:''}</div></div>
  <div class="section-t"><h2>✅ Actions à mener</h2></div>
  <div class="card">${acts.length?acts.map(actionRow).join(''):'<div class="muted small">Aucune action.</div>'}
   <div class="actform"><input class="inp" id="af-text" placeholder="Action à mener…"><select class="inp" id="af-co"><option value="">Responsable…</option>${comps().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}<option value="__moe">Maîtrise d'œuvre</option><option value="__moa">Maître d'ouvrage</option></select><input class="inp" type="date" id="af-due"><button class="btn sm primary" data-act="act-quick" data-visit="${v.id}">Ajouter</button></div></div>
  ${att.length?`<div class="section-t"><h2>Présences & avancement</h2></div><div class="card tscroll"><table class="t"><thead><tr><th>Entreprise</th><th>Présence</th><th class="n">Effectif</th><th class="n">Avanc.</th></tr></thead><tbody>${att.map(c=>{const a=attOf(v,c.id);return `<tr><td><b>${esc(c.name)}</b><div class="small muted">${esc(c.lot||'')}</div></td><td>${PRESENCE[a.p]||''}</td><td class="n">${a.n||''}</td><td class="n">${a.av!=null&&a.av!==''?a.av+' %':''}</td></tr>`}).join('')}</tbody></table></div>`:''}
  <div class="section-t"><h2>📍 Réserves relevées (${iss.length})</h2></div>
  ${iss.length?`<div class="grid">${iss.map(issueCard).join('')}</div>`:`<div class="card empty">Aucune réserve rattachée. Rendez la réunion active puis ajoutez des réserves.</div>`}
  <div class="section-t"><h2>✍️ Signatures</h2><button class="btn sm" data-act="sign" data-id="${v.id}">+ Faire signer</button></div>
  <div class="card">${(v.signatures||[]).length?`<div class="sigs">${v.signatures.map((s,k)=>`<div class="sig"><img src="${esc(s.img)}"><b>${esc(s.name)}</b><div class="muted">${esc(s.role||'')} · ${fmtDT(s.t)}</div><button data-act="sig-del" data-k="${k}">✕</button></div>`).join('')}</div>`:'<div class="muted small">Aucune signature. Utile pour les OPR, la réception ou un PV contradictoire.</div>'}</div>`}
/* ----- Entreprises ----- */
function viewCompanies(){return `<div class="row between" style="margin-bottom:14px"><h1>Entreprises</h1><button class="btn primary" data-act="new-co">+ Ajouter</button></div>
  ${S.companies.length?`<div class="grid">${comps().map(c=>{const k=counts(S.issues.filter(i=>i.companyId===c.id));const oa=S.actions.filter(a=>a.companyId===c.id&&a.status!=='faite').length;
   return `<div class="card"><div class="issue" style="padding:0" data-act="edit-co" data-id="${c.id}"><div class="thumb" style="font-size:20px;color:var(--ink)">👷</div><div class="body"><div class="ttl">${esc(c.name)}</div><div class="small muted">${esc(c.lot||'Lot non précisé')}${c.contact?' · '+esc(c.contact):''}</div><div class="small muted">${c.phone?esc(c.phone)+' ':''}${c.email?esc(c.email):''}</div></div>
   <div class="small" style="text-align:right"><b style="color:${STATUS.afaire.c}">${k.afaire+k.encours}</b> à lever<br><span style="color:${STATUS.levee.c}">${k.levee} à valider</span><br><span class="muted">${oa} action(s)</span></div></div>
   <div class="row" style="margin-top:10px"><button class="btn sm" data-act="relance" data-id="${c.id}">✉️ Relancer</button><button class="btn sm" data-act="co-link" data-id="${c.id}">🔗 ${S.links[c.id]?'Lien d\'accès':'Créer un lien d\'accès'}</button></div></div>`}).join('')}</div>`
  :`<div class="card empty"><div class="big">👷</div>Ajoutez les entreprises intervenant sur le chantier.<br>Chacune pourra recevoir un lien personnel pour consulter et lever ses réserves, sans créer de compte.</div>`}`}
/* ----- Rapports ----- */
function viewReports(){const R=S.rep;const vs=[...S.visits].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return `<h1 style="margin-bottom:14px">Rapports</h1><div class="card">
  <label class="f">Type de document<select class="inp" data-rep="type"><option value="reserves" ${R.type==='reserves'?'selected':''}>Rapport des réserves (état actuel)</option><option value="pv" ${R.type==='pv'?'selected':''}>Procès-verbal de réunion / visite</option></select></label>
  ${R.type==='pv'?`<label class="f">Réunion<select class="inp" data-rep="visitId"><option value="">— choisir —</option>${vs.map(v=>`<option value="${v.id}" ${R.visitId===v.id?'selected':''}>${esc(visitLabel(v))}</option>`).join('')}</select></label>`:''}
  <label class="f">Entreprise<select class="inp" data-rep="companyId"><option value="">Toutes les entreprises</option>${comps().map(c=>`<option value="${c.id}" ${R.companyId===c.id?'selected':''}>${esc((c.lot?c.lot+' – ':'')+c.name)}</option>`).join('')}</select></label>
  <div class="fld"><span>Statuts inclus</span>${Object.keys(STATUS).map(s=>`<label class="chk"><input type="checkbox" data-rep-st="${s}" ${R.st[s]?'checked':''}><span class="dot" style="background:${STATUS[s].c}"></span>${STATUS[s].l}</label>`).join('')}</div>

/* ====================== Modales ====================== */
function openModal(html,wide){$('#modal-root').innerHTML=`<div class="ov"><div class="sheet ${wide?'wide':''}">${html}</div></div>`}
function closeModal(){if(REC)REC.stop();$('#modal-root').innerHTML='';S.draft=null;S.draftKind=null}
function ask(msg,okLabel,withInput){return new Promise(res=>{const r=$('#confirm-root');r.innerHTML=`<div class="ov" style="z-index:60"><div class="sheet" style="max-width:440px"><div class="mb"><p style="margin:4px 0 10px">${esc(msg)}</p>${withInput?`<textarea class="inp" id="ask-in" rows="3" placeholder="${esc(withInput)}"></textarea>`:''}</div><div class="mf"><span class="sp"></span><button class="btn" data-c="0">Annuler</button><button class="btn primary" data-c="1">${esc(okLabel||'Confirmer')}</button></div></div></div>`;
  r.onclick=e=>{const b=e.target.closest('[data-c]');if(b){const v=withInput?($('#ask-in').value||'').trim():true;r.innerHTML='';r.onclick=null;res(b.dataset.c==='1'?v:false)}}})}
function rerenderModal(fn){const mb=$('#modal-root .mb');const t=mb?mb.scrollTop:0;fn();const n=$('#modal-root .mb');if(n)n.scrollTop=t}
const field=(label,f,val,type,extra)=>`<label class="f">${label}<input class="inp" data-f="${f}" type="${type||'text'}" value="${esc(val||'')}" ${extra||''}></label>`;

/* Projet */
function editProject(p){S.draftKind='proj';S.draft=Object.assign({name:'',address:'',moa:'',moe:'',ref:''},p||{});const D=S.draft;
  openModal(`<div class="mh"><h2>${D.id?'Paramètres du projet':'Nouveau projet'}</h2><button class="x" data-act="close">×</button></div><div class="mb">
  ${field('Nom du projet *','name',D.name,'text','placeholder="Ex. : Résidence Les Tilleuls – 24 logements"')}${field('Adresse du chantier','address',D.address)}
  <div class="g2">${field("Maître d'ouvrage",'moa',D.moa)}${field("Architecte / Maître d'œuvre",'moe',D.moe||CFG.companyName||'')}</div>${field("Référence / n° d'affaire",'ref',D.ref)}</div>
  <div class="mf">${D.id?'<button class="btn danger" data-act="del-proj">Supprimer le projet</button>':''}<span class="sp"></span><button class="btn" data-act="close">Annuler</button><button class="btn primary" data-act="save-proj">Enregistrer</button></div>`)}
async function saveProject(){const D=S.draft;if(!D.name.trim())return toast('Le nom est obligatoire');const isNew=!D.id;const id=D.id||uid();const {id:_,...data}=D;if(isNew)data.createdAt=Date.now();
  try{await API.set('projects/'+id,data);closeModal();if(isNew)openProject(id)}catch(e){handleErr(e)}}
async function deleteProject(){if(!await ask('Supprimer définitivement ce projet et toutes ses données (plans, réserves, réunions, entreprises) ?','Supprimer'))return;
  busy('Suppression…');try{await API.delProject(S.pid);closeModal();closeProject()}catch(e){handleErr(e)}busy()}

/* Entreprise */
function editCompany(c){S.draftKind='co';S.draft=Object.assign({lot:'',name:'',contact:'',email:'',phone:''},c||{});const D=S.draft;
  openModal(`<div class="mh"><h2>${D.id?'Entreprise':'Nouvelle entreprise'}</h2><button class="x" data-act="close">×</button></div><div class="mb">
  ${field('Raison sociale *','name',D.name)}${field('Lot','lot',D.lot,'text','list="lots" placeholder="Ex. : Gros œuvre"')}<datalist id="lots">${LOTS.map(l=>`<option value="${esc(l)}">`).join('')}</datalist>
  ${field('Interlocuteur','contact',D.contact)}<div class="g2">${field('E-mail','email',D.email,'email')}${field('Téléphone','phone',D.phone,'tel')}</div></div>

/* Annotation photo */
function annotate(k){const D=S.draft;const ref=D.photos[k];const col={c:'#ff2d2d'};let strokes=[],cur=null,img=null;
  openModal(`<div class="mh"><h2>Annoter la photo</h2><button class="x" data-act="annot-cancel">×</button></div><div class="mb annot"><div class="row" style="margin-bottom:10px"><div class="colors">${['#ff2d2d','#ffd43b','#ffffff','#1c7ed6'].map((c,i)=>`<button data-col="${c}" class="${i?'':'on'}" style="background:${c}"></button>`).join('')}</div><span class="sp"></span><button class="btn sm" id="an-undo">↶ Annuler le trait</button></div><canvas id="an-c"></canvas></div>
  <div class="mf"><span class="sp"></span><button class="btn" data-act="annot-cancel">Annuler</button><button class="btn primary" id="an-save">Enregistrer</button></div>`,true);
  S.draft=D;S.draftKind='issue';const cv=$('#an-c'),ctx=cv.getContext('2d');
  const redraw=()=>{ctx.drawImage(img,0,0,cv.width,cv.height);for(const s of strokes){ctx.strokeStyle=s.c;ctx.lineWidth=cv.width/120;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();s.p.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(s.p.length===1)ctx.lineTo(s.p[0][0]+.1,s.p[0][1]);ctx.stroke()}};
  loadImg(imgSrc(ref)).then(i=>{img=drawScaled(i,1600);cv.width=img.width;cv.height=img.height;redraw()}).catch(()=>toast('Image indisponible'));
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.addEventListener('pointerdown',e=>{if(!img)return;cv.setPointerCapture(e.pointerId);cur={c:col.c,p:[pos(e)]};strokes.push(cur);redraw()});
  cv.addEventListener('pointermove',e=>{if(!cur)return;cur.p.push(pos(e));redraw()});const end=()=>{cur=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  $('.colors').onclick=e=>{const b=e.target.closest('[data-col]');if(!b)return;col.c=b.dataset.col;document.querySelectorAll('.colors button').forEach(x=>x.classList.toggle('on',x===b))};
  $('#an-undo').onclick=()=>{strokes.pop();redraw()};
  $('#an-save').onclick=async()=>{if(!img)return;if(!strokes.length){editIssue(D);return}busy('Enregistrement…');try{const b=await canvasBlob(cv,.85);D.photos[k]=await storeImage(b,'photo')}catch(e){handleErr(e)}busy();editIssue(D)}}

function signVisit(vid){const v=S.visits.find(x=>x.id===vid);if(!v)return;let pts=[],cur=null;

  const cv=$('#sg-c');const r0=cv.getBoundingClientRect();cv.width=r0.width*2;cv.height=r0.height*2;const ctx=cv.getContext('2d');ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#14213d';
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);cur=pos(e);pts.push(1);ctx.beginPath();ctx.moveTo(...cur)});
  cv.addEventListener('pointermove',e=>{if(!cur)return;const p=pos(e);ctx.lineTo(...p);ctx.stroke();cur=p});const end=()=>{cur=null};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  $('#sg-clear').onclick=()=>{ctx.clearRect(0,0,cv.width,cv.height);pts=[]};
  $('#sg-save').onclick=async()=>{const name=$('#sg-n').value.trim();if(!name)return toast('Indiquez le nom du signataire');if(!pts.length)return toast('La signature est vide');
    const c=document.createElement('canvas');c.width=500;c.height=Math.round(500*cv.height/cv.width);c.getContext('2d').drawImage(cv,0,0,c.width,c.height);

    try{await API.set(P.doc('visits',vid),nv);closeModal();toast('Signature enregistrée')}catch(e){handleErr(e)}}}

  ${i.status==='validee'?'':`<div class="card" style="background:#faf9f6;margin-top:10px"><label class="f">Votre commentaire ${mic('pt-c')}<textarea class="inp" id="pt-c" rows="3" placeholder="Date d'intervention, travaux réalisés…"></textarea></label>
   <div class="fld"><span>Photos (après travaux)</span><div class="photos">${PT.photos.map((p,k)=>`<div class="ph" style="background-image:url('${esc(p.d)}')"><button class="rm" data-act="pt-rmph" data-k="${k}">✕</button></div>`).join('')}${PT.photos.length<4?`<label class="addph">📷<br>Ajouter<input type="file" accept="image/*" multiple data-file="ptphoto"></label>`:''}</div></div>
   <div class="row"><button class="btn" data-act="pt-send" data-s="">Envoyer le commentaire</button>${i.status==='afaire'?`<button class="btn" data-act="pt-send" data-s="encours">Je prends en charge</button>`:''}${i.status==='afaire'||i.status==='encours'?`<button class="btn green" data-act="pt-send" data-s="levee">✔ Déclarer levée</button>`:''}</div></div>`}
  </div>`);PT.redraw=()=>{const c=$('#pt-c');const v=c?c.value:'';draw();const n=$('#pt-c');if(n)n.value=v};draw()}
async function portalSend(st){const i=S.issues.find(x=>x.id===PT.open);if(!i)return;const c=($('#pt-c')||{}).value||'';
  if(!st&&!c.trim()&&!PT.photos.length)return toast('Ajoutez un commentaire ou une photo');
  if(st==='levee'&&!PT.photos.length&&!await ask('Déclarer la réserve levée sans photo ? Une photo facilite la validation.','Déclarer levée'))return;
  busy('Envoi…');const {data,error}=await Supa.sb.rpc('portal_update_issue',{p_token:PT.token,p_issue:i.id,p_comment:c,p_photos:PT.photos,p_status:st||null});busy();
  if(error||!data)return toast('Envoi impossible : '+((error&&error.message)||'lien invalide'));PT.photos=[];toast(st==='levee'?'Levée déclarée, merci !':'Envoyé');$('#modal-root').innerHTML='';PT.open=null;await portalLoad()}

/* ====================== Événements ====================== */
const ACT={
  'logout':async()=>{await Supa.sb.auth.signOut();location.reload()},
  'home':()=>closeProject(),'open-proj':el=>openProject(el.dataset.id),'new-proj':()=>editProject(),'edit-proj':()=>editProject(curProj()),'save-proj':saveProject,'del-proj':deleteProject,
  'close':()=>closeModal(),'zoom-img':(el,e)=>{if(e.target.closest('button'))return;lightbox(el.dataset.src)},'mic':el=>toggleMic(el),
  'tab':el=>{S.tab=el.dataset.t;S.adding=false;if(el.dataset.t!=='plans'&&!S.placing)S.planView=null;if(el.dataset.t!=='visits')S.visitView=null;render();scrollTo(0,0)},
  'goto-st':el=>{S.f={q:'',status:el.dataset.s,company:'',plan:''};S.tab='issues';render();scrollTo(0,0)},
  'goto-co':el=>{S.f={q:'',status:'',company:el.dataset.id,plan:''};S.tab='issues';render();scrollTo(0,0)},
  'clear-f':()=>{S.f={q:'',status:'',company:'',plan:''};render()},
  'new-co':()=>editCompany(),'edit-co':el=>editCompany(comp(el.dataset.id)),'save-co':saveCompany,'del-co':deleteCompany,
  'co-link':el=>openCoLink(el.dataset.id),'relance':el=>openRelance(el.dataset.id),'rl-copy':()=>copyText($('#rl-t').value),
  'lk-copy':el=>copyText(linkUrl(el.dataset.t)),'account':()=>openAccount(),
  'lk-send':async el=>{const c=comp(el.dataset.id)||{};const t=el.dataset.t;busy('Envoi…');let err=null;
    try{const r=await Supa.sb.functions.invoke('envoi-lien',{body:{token:t}});err=r.error}catch(x){err=x}busy();
    if(!err)return toast('Lien envoyé à '+c.email);
    if(await ask("L'envoi automatique n'est pas configuré ou a échoué. Ouvrir votre messagerie avec un e-mail prérempli ?",'Ouvrir ma messagerie'))
      location.href=mailto(c.email,'Accès à vos réserves – '+curProj().name,`Bonjour,\n\nVoici votre lien personnel pour consulter et lever vos réserves sur le chantier « ${curProj().name} » :\n${linkUrl(t)}\n\nAucun compte n'est nécessaire.\n\nCordialement`)},
  'lk-create':async el=>{busy('Création du lien…');try{const t=await API.saveLink(S.pid,el.dataset.id);S.links[el.dataset.id]=t;busy();openCoLink(el.dataset.id);render()}catch(e){busy();handleErr(e)}},
  'lk-revoke':async el=>{if(!await ask("Désactiver ce lien ? L'entreprise n'aura plus accès. Vous pourrez en créer un nouveau.",'Désactiver'))return;try{await API.revokeLink(S.links[el.dataset.id]);delete S.links[el.dataset.id];closeModal();render();toast('Lien désactivé')}catch(e){handleErr(e)}},
  'open-plan':el=>{S.planView=el.dataset.id;S.zoom=1;render();scrollTo(0,0)},'close-plan':()=>{S.planView=null;S.adding=false;render()},
  'edit-plan':el=>editPlan(S.plans.find(p=>p.id===el.dataset.id)),
  'save-plan':async()=>{const {id,...d}=S.draft;try{await API.set(P.doc('plans',id),d);closeModal()}catch(e){handleErr(e)}},
  'del-plan':async()=>{const D=S.draft;const n=S.issues.filter(i=>i.planId===D.id).length;if(!await ask(`Supprimer le plan « ${D.name} » ?${n?` Les ${n} réserve(s) placées dessus seront conservées sans emplacement.`:''}`,'Supprimer'))return;try{await API.del(P.doc('plans',D.id));closeModal();S.planView=null;render()}catch(e){handleErr(e)}},
  'zoom':el=>{const ps=$('.plan-scroll');const old=S.zoom;S.zoom=Math.max(1,Math.min(6,+(S.zoom*(el.dataset.z==='1'?1.5:1/1.5)).toFixed(2)));if(S.zoom<1.05)S.zoom=1;
    const cx=ps?ps.scrollLeft+ps.clientWidth/2:0,cy=ps?ps.scrollTop+ps.clientHeight/2:0;render();const n=$('.plan-scroll');if(n&&ps){const k=S.zoom/old;n.scrollLeft=cx*k-n.clientWidth/2;n.scrollTop=cy*k-n.clientHeight/2}},
  'toggle-add':()=>{S.adding=!S.adding;render()},
  'plan-tap':(el,e)=>{if(!(S.adding||S.placing))return;const img=el.querySelector('img');const r=img.getBoundingClientRect();const x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;if(x<0||x>1||y<0||y>1)return;
    if(S.placing&&S.draft){const D=S.draft;D.planId=el.dataset.id;D.x=+x.toFixed(4);D.y=+y.toFixed(4);S.placing=false;render();editIssue(D)}else editIssue(newIssue({planId:el.dataset.id,x:+x.toFixed(4),y:+y.toFixed(4)}))},
  'cancel-place':()=>{const D=S.draft;S.placing=false;render();if(D)editIssue(D)},
  'new-issue':()=>editIssue(newIssue(S.planView?{planId:S.planView}:{})),
  'open-issue':el=>{const i=S.issues.find(x=>x.id===el.dataset.id);if(i)editIssue(JSON.parse(JSON.stringify(Object.assign({photos:[],history:[]},i))))},
  'd-status':el=>{S.draft.status=el.dataset.s;rerenderModal(renderIssueModal)},
  'd-validate':async()=>{const D=S.draft;D.status='validee';await saveIssue()},
  'd-refuse':async()=>{const m=await ask('Motif du refus (visible par l\'entreprise) :','Refuser la levée','Ex. : joint silicone toujours absent côté baignoire');if(m===false)return;const D=S.draft;D.status='afaire';D.history=D.history||[];D.history.push({t:Date.now(),txt:'Levée refusée'+(m?' : '+m:'')});await saveIssue()},
  'd-place':()=>{const D=S.draft;S.placing=true;$('#modal-root').innerHTML='';S.tab='plans';S.planView=D.planId||(S.plans.length===1?S.plans[0].id:null);S.zoom=1;render();scrollTo(0,0)},
  'd-rmph':el=>{S.draft.photos.splice(+el.dataset.k,1);rerenderModal(renderIssueModal)},
  'd-annot':el=>annotate(+el.dataset.k),'annot-cancel':()=>editIssue(S.draft),
  'd-cmt':()=>{const v=$('#cmt').value.trim();if(!v)return;S.draft.history=S.draft.history||[];S.draft.history.push({t:Date.now(),txt:v});rerenderModal(renderIssueModal)},
  'd-save':saveIssue,
  'd-del':async()=>{const D=S.draft;if(!await ask(`Supprimer la réserve n°${D.num} ?`,'Supprimer'))return;try{await API.del(P.doc('issues',D.id));closeModal()}catch(e){handleErr(e)}},
  'new-visit':()=>editVisit(),'edit-visit':el=>editVisit(S.visits.find(v=>v.id===el.dataset.id)),
  'next-visit':el=>{const v=S.visits.find(x=>x.id===el.dataset.id);const att={};Object.keys(v.att||{}).forEach(k=>{const a=attOf(v,k);if(a.p)att[k]={p:'convoque',av:a.av}});
    editVisit(null,{type:v.type,date:v.nextDate||today(),num:String((+v.num||0)+1),att,others:v.others||''})},
  'save-visit':el=>saveVisit(el.dataset.start==='1'),
  'del-visit':async()=>{const D=S.draft;if(!await ask('Supprimer cette réunion ? Les réserves et actions rattachées sont conservées.','Supprimer'))return;try{await API.del(P.doc('visits',D.id));if(S.activeVisit===D.id)setActive('');closeModal();S.visitView=null;render()}catch(e){handleErr(e)}},
  'open-visit':el=>{S.tab='visits';S.visitView=el.dataset.id;render();scrollTo(0,0)},'close-visit':()=>{S.visitView=null;render()},
  'start-visit':el=>setActive(el.dataset.id),'stop-visit':()=>{setActive('');toast('Réunion terminée')},
  'pv-visit':el=>{S.rep.type='pv';S.rep.visitId=el.dataset.id;generatePDF(el.dataset.id)},
  'kp-add':()=>{const t=$('#kp-text').value.trim();if(!t)return toast('Saisissez le point à retenir');const type=$('#kp-type').value;patchVisit(S.visitView,v=>{v.keypoints=[...(v.keypoints||[]),{type,text:t,t:Date.now()}]})},
  'kp-del':async el=>{if(!await ask('Supprimer ce point clé ?','Supprimer'))return;patchVisit(S.visitView,v=>{v.keypoints.splice(+el.dataset.k,1)})},
  'sign':el=>signVisit(el.dataset.id),
  'sig-del':async el=>{if(!await ask('Supprimer cette signature ?','Supprimer'))return;patchVisit(S.visitView,v=>{v.signatures.splice(+el.dataset.k,1)})},
  'act-new':()=>editAction(null),'act-edit':el=>editAction(S.actions.find(a=>a.id===el.dataset.id)),
  'act-save':async()=>{if(await saveAction(S.draft))closeModal()},
  'act-del':async()=>{const D=S.draft;if(!await ask('Supprimer cette action ?','Supprimer'))return;try{await API.del(P.doc('actions',D.id));closeModal()}catch(e){handleErr(e)}},
  'act-toggle':el=>{const a=S.actions.find(x=>x.id===el.dataset.id);if(!a)return;const d=JSON.parse(JSON.stringify(a));d.status=a.status==='faite'?'ouverte':'faite';d.doneBy=d.status==='faite'?'moe':undefined;if(d.status==='faite')d.doneAt=Date.now();saveAction(d)},
  'act-quick':async el=>{const t=$('#af-text').value.trim();if(!t)return toast("Décrivez l'action");const co=$('#af-co').value;
    const d={text:t,companyId:co.startsWith('__')?'':co,who:co==='__moe'?"Maîtrise d'œuvre":co==='__moa'?"Maître d'ouvrage":'',due:$('#af-due').value,status:'ouverte',visitId:el.dataset.visit};if(await saveAction(d))toast('Action ajoutée')},
  'gen-pdf':()=>generatePDF(),'export-csv':()=>{saveFile(slug(curProj().name)+'_reserves_'+today()+'.csv',new Blob([csvText()],{type:'text/csv;charset=utf-8'}));toast('Fichier téléchargé')},
  'copy-sum':()=>copyText(summaryText()),
  /* portail */
  'pt-open':el=>portalIssue(el.dataset.id),'pt-close':()=>{$('#modal-root').innerHTML='';PT.open=null;PT.photos=[]},
  'pt-reload':()=>portalLoad(),'pt-send':el=>portalSend(el.dataset.s),
  'pt-rmph':el=>{PT.photos.splice(+el.dataset.k,1);PT.redraw()},
  'pt-actdone':async el=>{if(!await ask('Confirmer que cette action est réalisée ?','Confirmer'))return;busy('Envoi…');const {data,error}=await Supa.sb.rpc('portal_action_done',{p_token:PT.token,p_action:el.dataset.id});busy();if(error||!data)return toast('Envoi impossible');toast('Merci !');portalLoad()},
  'pt-pdf':()=>{S.rep={type:'reserves',visitId:'',companyId:PT.data.company.id,st:{afaire:true,encours:true,levee:true,validee:true},plans:true,photos:true};generatePDF()},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){if(el.tagName==='BUTTON'||el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();f(el,e)}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.f&&S.draft){S.draft[t.dataset.f]=t.value;return}
  if(t.dataset.att&&S.draft){const a=S.draft.att[t.dataset.att]=S.draft.att[t.dataset.att]||{};a[t.dataset.k]=t.value;return}
  if(t.dataset.filter==='q'){S.f.q=t.value;const l=$('#issue-list');if(l)l.innerHTML=issueList();const c=$('#icount');if(c)c.textContent=filtered().length}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.f&&S.draft){S.draft[t.dataset.f]=t.value;if(t.dataset.f==='planId'&&S.draftKind==='issue'){S.draft.x=null;S.draft.y=null;rerenderModal(renderIssueModal)}return}
  if(t.dataset.att&&S.draft){const a=S.draft.att[t.dataset.att]=S.draft.att[t.dataset.att]||{};a[t.dataset.k]=t.value;return}
  if(t.dataset.filter&&t.dataset.filter!=='q'){S.f[t.dataset.filter]=t.value;render();return}
  if(t.dataset.rep){S.rep[t.dataset.rep]=t.value;render();return}
  if(t.dataset.repSt){S.rep.st[t.dataset.repSt]=t.checked;return}
  if(t.dataset.repB){S.rep[t.dataset.repB]=t.checked;return}
  if(t.dataset.file){const files=[...t.files];t.value='';if(!files.length)return;
    if(t.dataset.file==='plan')addPlans(files);else if(t.dataset.file==='photo')addPhotos(files);
    else if(t.dataset.file==='ptphoto'){(async()=>{for(const f of files){if(PT.photos.length>=4)break;busy('Préparation de la photo…');try{PT.photos.push(await smallPhoto(f))}catch(_){toast("Impossible de lire l'image")}}busy();PT.redraw()})()}}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='cmt'){e.preventDefault();ACT['d-cmt']()}else if(e.target.id==='kp-text'){e.preventDefault();ACT['kp-add']()}else if(e.target.id==='af-text'){e.preventDefault();const b=$('[data-act="act-quick"]');b&&ACT['act-quick'](b)}});
init();
</script>
